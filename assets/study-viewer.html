<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>代码与项目导读</title>
  <style>
    :root { color-scheme:light dark; --bg:light-dark(#fff,#151f20); --soft:light-dark(#f3f6f4,#1d2a2a); --fg:light-dark(#213a35,#e5eeea); --muted:light-dark(#52675f,#adc1b8); --line:light-dark(#d4dfd9,#3a4b46); --edge:light-dark(#859c91,#80998d); --accent:light-dark(#07695d,#79d7bb); --selected:light-dark(#e4f2eb,#244238); --code:light-dark(#f7f9f7,#111b1c); --warn:light-dark(#87501f,#efbf8f); --keyword:light-dark(#3658a1,#a5c4f2); --string:light-dark(#276744,#a8d5b0); --number:light-dark(#9a4d17,#f0bd85); --comment:light-dark(#597067,#a7bdb2); --function:light-dark(#774897,#d5b7eb); }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.65 "Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
    ::selection { background:var(--selected); color:var(--fg); }
    :focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    button,input,select,textarea { font:inherit; }
    button { cursor:pointer; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:7px 11px; font-size:13px; line-height:1.5; }
    button:hover { background:var(--soft); border-color:var(--edge); }
    button[aria-pressed="true"] { color:var(--accent); background:var(--selected); }
    button:disabled { opacity:.5; cursor:default; }
    [hidden] { display:none !important; }
    h1,h2,h3,p { margin:0; }
    h1 { font-size:18px; font-weight:600; line-height:1.5; overflow-wrap:anywhere; }
    h2 { font-size:23px; font-weight:600; line-height:1.45; overflow-wrap:anywhere; }
    h3 { font-size:16px; font-weight:600; line-height:1.5; }
    .detail h2 { font-size:19px; }
    .detail h3 { font-size:14px; }
    code { font-family:ui-monospace,Consolas,monospace; }
    .top { display:flex; flex-wrap:wrap; gap:16px 24px; align-items:center; padding:18px 24px; border-bottom:1px solid var(--line); }
    .brand { min-width:180px; max-width:440px; }
    .sub { color:var(--muted); font-size:12px; line-height:1.7; }
    .tabs { display:flex; flex-wrap:wrap; gap:4px; padding:3px; background:var(--soft); border-radius:6px; }
    .tabs button { background:transparent; border-color:transparent; }
    .tabs button[aria-pressed="true"] { background:var(--bg); border-color:var(--line); }
    .history-nav { display:flex; gap:4px; margin-bottom:18px; }
    .history-nav button { flex:1; padding:5px 8px; }
    .sidebar-section { margin:14px 0; }
    .sidebar-section > summary { cursor:pointer; font-size:12px; font-weight:600; color:var(--muted); padding:6px 7px; }
    .sidebar-section > select { margin:9px 0; }
    .search { margin-left:auto; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .search input { width:210px; max-width:100%; border:1px solid var(--line); color:var(--fg); background:var(--bg); padding:7px 10px; border-radius:6px; }
    .notice { padding:8px 22px; font-size:12px; color:var(--muted); border-bottom:1px solid var(--line); overflow-wrap:anywhere; }
    .notice summary { cursor:pointer; }
    .notice p { margin-top:8px; }
    .layout { display:grid; grid-template-columns:232px minmax(0,1fr) 366px; min-height:calc(100vh - 142px); }
    .layout.reader { grid-template-columns:232px minmax(0,1fr) 320px; }
    .sidebar { background:var(--soft); border-right:1px solid var(--line); padding:20px 14px; min-width:0; }
    .main { padding:26px 28px; min-width:0; }
    .detail { border-left:1px solid var(--line); padding:26px 20px; min-width:0; font-size:14px; }
    .group { margin:8px 0; }
    .group summary { cursor:pointer; color:var(--muted); padding:4px 7px; font-size:12px; overflow-wrap:anywhere; }
    .file-button,.symbol-button,.step-button,.link-button { display:block; width:100%; text-align:left; border:0; margin:2px 0; padding:7px 9px; background:transparent; overflow-wrap:anywhere; }
    .file-button,.symbol-button { font-family:ui-monospace,Consolas,monospace; font-size:12px; display:flex; align-items:baseline; gap:7px; }
    .file-button .file-name,.symbol-button .symbol-name { flex:1; min-width:0; }
    .symbol-list { padding-left:8px; margin:3px 0 8px; }
    .symbol-button .symbol-type { color:var(--muted); font-family:"Segoe UI","Microsoft YaHei",sans-serif; font-size:10px; flex-shrink:0; }
    .file-count { font-size:10px; color:var(--muted); }
    .symbol-button { color:var(--muted); }
    .step-button small { display:block; color:var(--muted); font-size:12px; margin-top:3px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; margin:22px 0 14px; padding-bottom:16px; border-bottom:1px solid var(--line); }
    .toolbar label { display:flex; gap:7px; align-items:center; color:var(--muted); font-size:12px; }
    select { color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:5px 7px; max-width:100%; }
    .file-path { color:var(--accent); font:12px ui-monospace,Consolas,monospace; overflow-wrap:anywhere; }
    .description { margin:12px 0 20px; white-space:pre-wrap; overflow-wrap:anywhere; max-width:68ch; line-height:1.85; }
    .graph-scroll { max-height:610px; overflow:auto; padding:4px 2px; }
    .graph { position:relative; min-height:180px; padding:10px; }
    .graph-svg { position:absolute; left:0; top:0; pointer-events:none; overflow:visible; }
    .graph-layer { position:relative; display:flex; flex-wrap:nowrap; gap:64px; justify-content:center; margin:28px 0; padding:0 28px; }
    #graph-canvas > .graph-layer + .graph-layer { margin-top:64px; }
    .graph-node { width:160px; max-width:100%; min-width:0; padding:10px 12px; background:var(--bg); text-align:left; font-size:12px; overflow-wrap:anywhere; border-radius:5px; }
    .graph-node .node-name { display:block; font:12px/1.6 ui-monospace,Consolas,monospace; }
    .graph-node .node-type { display:block; font-size:10px; color:var(--muted); margin-bottom:4px; }
    .graph-node small { display:block; color:var(--muted); font-size:11px; line-height:1.6; margin-top:5px; }
    .graph-node.active { background:var(--selected); border-color:var(--accent); }
    .graph-isolated { position:relative; margin-top:30px; border-top:1px solid var(--line); padding-top:12px; }
    .graph-isolated h3 { font-size:11px; color:var(--muted); font-weight:400; }
    .graph-isolated .graph-layer { margin:12px 0 5px; flex-wrap:wrap; gap:12px; padding:0; }
    .map-modes { display:flex; flex-wrap:wrap; gap:4px; }
    .map-modes button[aria-pressed="true"] { color:var(--accent); border-color:var(--accent); background:var(--selected); }
    .map-summary { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin:0 0 14px; }
    .map-summary p { margin:0; }
    .map-links { margin:18px 0; border-top:1px solid var(--line); padding-top:16px; }
    .map-links h3 { margin:0 0 7px; }
    .map-link { display:flex; flex-wrap:wrap; gap:6px 12px; justify-content:space-between; align-items:center; width:100%; text-align:left; margin:6px 0; padding:10px 12px; }
    .map-link[aria-pressed="true"] { border-color:var(--accent); background:var(--selected); }
    .map-link .relation-meta { color:var(--muted); }
    .map-card-list { display:grid; gap:16px; }
    .map-card { border-bottom:1px solid var(--line); padding-bottom:16px; }
    .map-card > .graph-node { width:100%; margin-bottom:6px; }
    .map-card .map-link { border:0; padding:8px 0; background:transparent; }
    .edge-label { fill:var(--muted); font:10px "Segoe UI","Microsoft YaHei",sans-serif; pointer-events:none; paint-order:stroke; stroke:var(--bg); stroke-width:5px; stroke-linejoin:round; }
    .edge-path.mixed { stroke:var(--muted); }
    .node-reference { display:block; color:var(--accent); font-size:10px; margin-top:6px; }
    .relation-disclosure { border-top:1px solid var(--line); margin-top:24px; padding-top:16px; }
    .relation-disclosure .relation-list { border-top:0; margin-top:12px; padding-top:0; }
    .lesson-switch { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:18px; color:var(--muted); }
    .save-feedback { display:block; color:var(--accent); font-size:12px; margin:8px 0; }
    .edge-path { fill:none; stroke:var(--edge); stroke-width:1.5; pointer-events:none; }
    .edge-path.active { stroke:var(--accent); stroke-width:2.2; }
    .edge-path.dimmed { opacity:.45; }
    .edge-hit { fill:none; stroke:transparent; stroke-width:var(--hit-width,12); pointer-events:stroke; cursor:pointer; }
    .edge-hit:focus-visible { stroke:var(--accent); stroke-width:3; outline:none; }
    .edge-hit.inferred:focus-visible { stroke-dasharray:4 3; }
    .edge-hit.unresolved:focus-visible { stroke-dasharray:1 4; }
    .edge-path.inferred { stroke-dasharray:4 3; }
    .edge-path.unresolved { stroke-dasharray:1 4; }
    .edge-path.runtime_observed { stroke-width:2.5; }
    .legend { display:flex; flex-wrap:wrap; gap:6px 15px; color:var(--muted); font-size:12px; margin-top:8px; }
    .legend span { display:flex; align-items:center; gap:5px; }
    .legend i { display:inline-block; width:18px; border-top:1.5px solid var(--accent); }
    .legend .inferred { border-top-style:dashed; }
    .legend .unresolved { border-top-style:dotted; }
    .legend .runtime { border-top-width:3px; }
    .relation-list { border-top:1px solid var(--line); margin-top:26px; padding-top:18px; max-height:460px; overflow:auto; scrollbar-gutter:stable; }
    .relation-row { display:flex; flex-direction:column; gap:7px; align-items:stretch; padding:10px 0; border-bottom:1px solid var(--line); }
    .evidence-actions { display:flex; flex-wrap:wrap; gap:6px; }
    .relation-row button { text-align:left; font-size:12px; max-width:100%; overflow-wrap:anywhere; }
    .relation-row .relation-target { border:0; background:transparent; padding:0; display:inline; color:var(--accent); text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px; }
    .relation-row.selected { background:var(--selected); }
    .relation-name { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px; }
    .relation-action { align-self:flex-start; font-size:11px; padding:4px 7px; }
    .edge-selection { background:var(--soft); border:1px solid var(--line); border-radius:5px; padding:14px; margin:20px 0; font-size:13px; }
    .edge-selection h3 { font-size:14px; margin-bottom:10px; }
    .edge-selection .relation-row:last-child { border-bottom:0; padding-bottom:0; }
    .node-context { font-size:12px; color:var(--muted); margin:6px 0 10px; overflow-wrap:anywhere; }
    .relation-meta { font-size:12px; color:var(--muted); margin-top:4px; }
    .tag { display:inline-block; padding:2px 5px; border-radius:4px; background:var(--soft); color:var(--muted); font-size:11px; }
    .tag.warn { color:var(--warn); }
    .source-head { display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px; align-items:center; margin:18px 0 12px; }
    .breadcrumbs { display:flex; flex-wrap:wrap; gap:3px 8px; align-items:center; font:12px/1.65 ui-monospace,Consolas,monospace; overflow-wrap:anywhere; min-width:0; }
    .breadcrumbs button { border:0; padding:3px 0; color:var(--accent); background:transparent; font:inherit; overflow-wrap:anywhere; text-align:left; }
    .breadcrumbs span { color:var(--muted); }
    .source-frame { background:var(--code); border:1px solid var(--line); border-radius:5px; max-height:560px; overflow:auto; margin:12px 0; }
    .source-code { margin:0; padding:14px 0; min-width:100%; width:max-content; font:13px/1.85 ui-monospace,Consolas,monospace; tab-size:4; }
    .reader .source-code { font-size:13px; }
    .code-line { display:flex; min-width:100%; padding-right:16px; }
    .code-line.focused { background:var(--selected); }
    .line-no { min-width:4.5ch; padding:0 9px; color:var(--muted); text-align:right; user-select:none; flex-shrink:0; }
    .code-text { white-space:pre; }
    [data-syntax="keyword"] { color:var(--keyword); }
    [data-syntax="string"] { color:var(--string); }
    [data-syntax="number"] { color:var(--number); }
    [data-syntax="comment"] { color:var(--comment); }
    [data-syntax="function"] { color:var(--function); }
    .text-block { padding-top:20px; margin-top:25px; border-top:1px solid var(--line); }
    .text-block p { margin-top:10px; white-space:pre-wrap; overflow-wrap:anywhere; max-width:68ch; line-height:1.85; }
    .guided .text-block p,.guided .question p { font-size:16px; }
    .empty { color:var(--muted); padding:18px 0; overflow-wrap:anywhere; }
    .coverage { margin-top:22px; border-top:1px solid var(--line); padding-top:15px; font-size:12px; }
    .coverage summary { cursor:pointer; color:var(--muted); }
    .coverage ul { padding-left:19px; overflow-wrap:anywhere; }
    .question { border-top:1px solid var(--line); margin-top:30px; padding-top:22px; }
    .question p { margin:12px 0; white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.85; max-width:68ch; }
    textarea { color:var(--fg); background:var(--bg); border:1px solid var(--line); padding:12px; border-radius:5px; width:100%; min-height:106px; resize:vertical; caret-color:var(--accent); }
    textarea::placeholder,input::placeholder { color:var(--muted); opacity:1; }
    .primary { background:var(--accent); color:var(--bg); border-color:var(--accent); }
    .primary:hover { background:var(--accent); opacity:.9; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .route-context { display:flex; flex-wrap:wrap; gap:7px; margin:20px 0; }
    .route-context button { padding:5px 8px; border-radius:3px; font-size:12px; background:var(--soft); }
    .route-context button[aria-current="step"] { background:var(--selected); color:var(--accent); border-color:var(--accent); }
    .footer { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px 20px; padding:10px 20px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
    .status { color:var(--accent); }
    dialog { color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:10px; width:min(760px,calc(100% - 30px)); padding:20px; }
    dialog::backdrop { background:rgb(0 0 0 / .35); }
    .error { color:var(--warn); }
    @media(max-width:1200px) { .layout,.layout.reader { grid-template-columns:205px minmax(0,1fr) 316px; } .top { padding:16px 18px; } .main { padding:22px; } .detail { padding:22px 16px; } }
    @media(max-width:880px) { .layout,.layout.reader { grid-template-columns:180px minmax(0,1fr); } .detail { grid-column:2; border-left:0; border-top:1px solid var(--line); } .sidebar { grid-row:1 / span 2; } .search { margin-left:0; } }
    @media(max-width:520px) { .layout,.layout.reader { display:flex; flex-direction:column; } .sidebar { border-right:0; border-bottom:1px solid var(--line); } .main,.detail { padding:20px 15px; } .top,.notice { padding:12px 15px; } .tabs { width:100%; } .search { width:100%; } .search input { flex:1; min-width:120px; } .graph-node { width:132px; } .relation-list { max-height:none; } .source-code { font-size:12px; } .history-nav { max-width:210px; } h2 { font-size:21px; } }
    @media(prefers-reduced-motion:no-preference) { button { transition:background-color 160ms ease-out,border-color 160ms ease-out; } }
    @media(pointer:coarse) { button,input,select { min-height:44px; } }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand"><h1 id="project-title">代码与项目导读</h1><div class="sub" id="project-summary"></div></div>
    <nav class="tabs" aria-label="导读视图">
      <button type="button" data-view="atlas" aria-pressed="true">关系地图</button>
      <button type="button" data-view="guided" aria-pressed="false">路线导学</button>
      <button type="button" data-view="reader" aria-pressed="false">源码精读</button>
    </nav>
    <div class="search"><input id="search" type="search" placeholder="查找文件或符号" aria-label="查找文件或符号"><button type="button" id="export-progress">导出学习记录</button></div>
  </header>
  <details class="notice"><summary id="snapshot-summary">查看源码快照与项目位置</summary><p id="snapshot-notice"></p></details>
  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar" aria-label="文件、符号与学习路线"></aside>
    <main class="main" id="main"></main>
    <aside class="detail" id="detail" aria-label="源码、关系与讲解"></aside>
  </div>
  <footer class="footer"><span id="coverage-summary"></span><span class="status" id="status" role="status" aria-live="polite"></span></footer>
  <dialog id="copy-dialog"><h2>复制到 Codex 继续提问</h2><p class="sub" style="margin:8px 0">包含当前位置和对应源码版本，可补上你想了解的问题。</p><textarea id="copy-text" readonly aria-label="可复制的提问上下文"></textarea><div class="actions"><button type="button" id="copy-context" class="primary">复制内容</button><button type="button" id="close-dialog">关闭</button></div></dialog>
  <script type="application/json" id="study-data">__CODE_STUDY_DATA__</script>
  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      let data;
      try { data = JSON.parse($('study-data').textContent); }
      catch (_) { $('main').textContent = '这是固定导读模板。请通过 build_study_view.py 填入项目数据后打开生成的页面。'; return; }
      const files = new Map(data.files.map(file => [file.id,file]));
      const nodes = new Map(data.nodes.map(node => [node.id,node]));
      const edges = data.edges || [];
      const edgeById = new Map(edges.map(edge=>[edge.id,edge]));
      const lessons = data.lessons || [];
      const kinds = {import:'导入',call:'调用',event:'事件',data:'状态/数据',config:'配置',lifecycle:'生命周期'};
      const statuses = {source_confirmed:'源码确认',runtime_observed:'运行观察',inferred:'推断',unresolved:'未确定'};
      const nodeKinds = {file:'文件',function:'函数',method:'方法',class:'类',external:'外部目标',unknown:'未确定目标'};
      const storageKey = 'code-study:' + data.project.root;
      const defaults = {view:data.project.default_view||'atlas',node:(data.project.entry_node_ids||[]).find(id=>nodes.has(id))||data.files[0]?.id||null,query:'',kind:'all',evidenceStatus:'all',scope:'overview',mapMode:'summary',mapFocus:false,external:false,lesson:lessons[0]?.id||null,step:0,full:false,focus:null,selectedEdges:[]};
      let ui = {...defaults};
      const drafts = new Map();
      const sourceCache = new Map();
      const folderState = new Map();
      const disclosureState = new Map();
      const navHistory = [];
      let navIndex = -1;
      let progress = {schema_version:1,project_root:data.project.root,notes:[],answers:[],visited:[]};
      let storageAvailable = true;
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey)||'null');
        if(saved&&saved.schema_version===1&&saved.project_root===data.project.root){
          if(saved.ui&&['atlas','guided','reader'].includes(saved.ui.view))ui.view=saved.ui.view;
          if(saved.ui&&nodes.has(saved.ui.node))ui.node=saved.ui.node;
          if(saved.ui&&lessons.some(lesson=>lesson.id===saved.ui.lesson))ui.lesson=saved.ui.lesson;
          if(saved.ui&&Number.isInteger(saved.ui.step)&&saved.ui.step>=0)ui.step=saved.ui.step;
          if(['summary','full'].includes(saved.ui?.mapMode))ui.mapMode=saved.ui.mapMode;
          if(typeof saved.ui?.mapFocus==='boolean')ui.mapFocus=saved.ui.mapFocus;
          if(['overview','neighbors'].includes(saved.ui?.scope))ui.scope=saved.ui.scope;
          const file=files.get(nodes.get(ui.node)?.file_id);
          if(file&&saved.source_hashes?.[file.id]===file.sha256&&Array.isArray(saved.ui?.focus))ui.focus=saved.ui.focus.filter(line=>Number.isInteger(line)&&line>=1&&line<=sourceLines(file).length);
          if(Object.keys(saved.source_hashes||{}).length===data.files.length&&data.files.every(file=>saved.source_hashes?.[file.id]===file.sha256)&&Array.isArray(saved.ui?.selectedEdges))ui.selectedEdges=saved.ui.selectedEdges.filter(id=>edgeById.has(id)&&saved.ui?.edgeSignatures?.[id]===edgeSignature(edgeById.get(id)));
          for(const key of ['notes','answers','visited'])if(Array.isArray(saved[key]))progress[key]=saved[key].filter(item=>item&&typeof item==='object'&&typeof item.node_id==='string');
        }
      } catch (_) { storageAvailable=false; }
      function element(tag,cls,text){const item=document.createElement(tag);if(cls)item.className=cls;if(text!==undefined&&text!==null)item.textContent=String(text);return item;}
      function button(text,action,properties={},cls=''){const item=element('button',cls,text);item.type='button';item.dataset.action=action;for(const [key,value]of Object.entries(properties))item.dataset[key]=String(value);return item;}
      function append(parent,...children){for(const child of children)if(child)parent.appendChild(typeof child==='string'?document.createTextNode(child):child);return parent;}
      function block(title,text){const item=element('section','text-block');append(item,element('h3','',title),element('p','',text));return item;}
      function message(text){$('status').textContent=text;}
      function fileFor(node){return node?.file_id?files.get(node.file_id)||null:null;}
      function currentNode(){return nodes.get(ui.node)||null;}
      function qualifiedName(node){if(!node)return '';if(node.kind==='file')return files.get(node.id)?.path||node.name;const names=[node.name];let parent=nodes.get(node.parent_id);const seen=new Set([node.id]);while(parent&&parent.kind!=='file'&&!seen.has(parent.id)){seen.add(parent.id);names.unshift(parent.name);parent=nodes.get(parent.parent_id);}return names.join('.');}

        if(action==='save-note'){saveRecord('notes');return;}
        if(target.id==='close-dialog'){$('copy-dialog').close();return;}
        if(target.id==='copy-context'){const text=$('copy-text').value;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>message('内容已复制。')).catch(()=>{$('copy-text').focus();$('copy-text').select();message('内容已选中，可手动复制。');});else{$('copy-text').focus();$('copy-text').select();message('内容已选中，可手动复制。');}return;}
        if(target.id==='export-progress'){persist();progress.exported_at_utc=new Date().toISOString();const blob=new Blob([JSON.stringify(progress,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='code-study-progress.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message('已导出原始学习记录。');}
      });
      document.addEventListener('keydown',event=>{const hit=event.target.closest('.edge-hit');if(hit&&(event.key==='Enter'||event.key===' ')){event.preventDefault();updateHistoryLocation();selectEdge(JSON.parse(hit.dataset.edgeIds),true);}});
      document.addEventListener('change',event=>{const target=event.target;if(target.id==='map-scope'){ui.scope=target.value;ui.mapFocus=false;}else if(target.id==='relation-kind')ui.kind=target.value;else if(target.id==='relation-status')ui.evidenceStatus=target.value;else if(target.id==='include-external')ui.external=target.checked;else if(target.id==='lesson-picker'){updateHistoryLocation();ui.lesson=target.value;selectStep(0);return;}else return;ui.selectedEdges=[];persist();render();});
      document.addEventListener('toggle',event=>{if(!event.target.isConnected)return;if(event.target.dataset.folder)folderState.set(event.target.dataset.folder,event.target.open);if(event.target.dataset.disclosure)disclosureState.set(event.target.dataset.disclosure,event.target.open);},true);
      document.addEventListener('input',event=>{const key=event.target.dataset.draftKey;if(key)drafts.set(key,event.target.value);});
      $('search').addEventListener('input',event=>{ui.query=event.target.value;ui.selectedEdges=[];render();});
      if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>{if(ui.view==='atlas')drawEdges(projectedGraph());}).observe($('main'));
      matchMedia('(max-width:520px)').addEventListener('change',()=>{compactNavigation();render();});
      matchMedia('(max-width:639px)').addEventListener('change',()=>render());
      rememberLocation();render();if(!storageAvailable)message('当前记录保留在页面内，可通过导出保存。');
    })();
  </script>
</body>
</html>
